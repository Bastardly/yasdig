<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustimage</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Full-bleed: the page starts at the left edge and runs to the right one, so
     a wide screen gets a third column rather than a wider margin. The columns
     cap themselves — see .layout. */
  body {
    margin: 0; font: 15px/1.5 system-ui, sans-serif;
    background: #0e1116; color: #e6edf3;
    display: flex; padding: 16px;
  }
  .app { width: 100%; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b949e; margin: 0 0 20px; font-size: 13px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  /* Three columns that flow: controls, result, work items. Flex rather than a
     grid with a breakpoint, because each column has a different *useful* width
     and they should wrap independently — the work items drop under the other two
     long before the controls and the result have to stack.

     The caps are what matters. Left to itself the result column takes every
     pixel the page has, and a 1536² render displayed at 1800px wide is not more
     legible, it's just further from the controls. The flex bases below add up
     (with gaps) to ~1400px, which is the width at which all three fit on one
     row; under that the work items wrap, and under ~960 the result does too. */
  .layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  /* Without this a flex item's automatic minimum size is its content's intrinsic
     width — the image's own pixel width — which would blow the column out past
     the viewport instead of scaling the picture down. */
  .layout > * { min-width: 0; }
  /* Its own class, not `.layout > .card`: the work items panel is a `.card` and
     a direct child too, and would take the controls' cap. */
  .col-controls { flex: 1 1 380px; max-width: 420px; }
  .col-result { flex: 3 1 560px; max-width: 1024px; }
  .workitems { flex: 2 1 460px; max-width: 660px; }
  /* Below this the wrapping is already one-per-row, but the caps would leave a
     420px controls card stranded beside empty space. One column, full width. */
  @media (max-width: 899px) {
    .col-controls, .col-result, .workitems { flex-basis: 100%; max-width: none; }
  }
  label { display: block; font-size: 13px; color: #8b949e; margin: 12px 0 4px; }
  textarea, input, select {
    width: 100%; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 9px 10px; font: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 160px; }
  button {
    margin-top: 16px; width: 100%; padding: 11px; font: inherit; font-weight: 600;
    background: #238636; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  /* Declared before :disabled — same specificity, so source order decides. */
  button.secondary { background: #1f6feb; }
  button.danger { background: #da3633; }
  button:disabled { background: #30363d; color: #8b949e; cursor: default; }
  /* The escalation controls sit above the image; they share a row when the
     column is wide enough and stack when it isn't. */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .actions button { margin-top: 0; width: auto; flex: 1 1 140px; padding: 9px 14px; }
  .actions select { width: auto; flex: 0 0 auto; }
  .result img {
    max-width: 100%; border-radius: 10px; border: 1px solid #30363d;
    display: block; margin-top: 12px; cursor: zoom-in;
  }
  /* Full-size viewer: the image keeps its natural dimensions and the dialog
     scrolls, so you inspect it at true 1:1 instead of a fitted preview. */
  #lightbox {
    width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh;
    margin: 0; padding: 0; border: 0; background: transparent; overflow: auto;
  }
  #lightbox::backdrop { background: rgba(0, 0, 0, .85); }
  #lightbox img { display: block; cursor: zoom-out; }
  .meta { font-size: 13px; color: #8b949e; }
  .meta b { color: #e6edf3; font-weight: 600; }
  .meta b.pin { cursor: pointer; border-bottom: 1px dashed #8b949e; }
  .err { color: #ff7b72; white-space: pre-wrap; font-size: 13px; margin-top: 12px; }
  .bars { margin-top: 12px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar .name { width: 60px; color: #8b949e; }
  .bar .track { flex: 1; background: #0d1117; border-radius: 4px; height: 10px; overflow: hidden; }
  .bar .fill { height: 100%; background: #388bfd; }
  .bar .val { width: 72px; text-align: right; color: #e6edf3; }
  /* The post-process panel sits under the image and is laid out like the timing
     bars above it: fixed-width name, the control taking the slack, value right. */
  #post { margin-top: 16px; }
  .posthead { display: flex; justify-content: space-between; align-items: baseline; }
  .slider { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .slider label { margin: 0; width: 72px; flex: 0 0 auto; }
  .slider input[type=range] { flex: 1; padding: 0; border: 0; background: none; accent-color: #388bfd; }
  /* Wide enough for a minus sign: clarity runs -1..1. */
  .slider .val { width: 48px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .slider input:disabled { opacity: .5; }

  /* What pressing Generate will actually do — how many images, and what happens
     to each one — as opposed to what any single image is made of. Hence the rule
     above it: these are settings of a *run*. */
  .run { border-top: 1px solid #30363d; margin-top: 16px; padding-top: 4px; }
  .grouphead { display: block; font-size: 13px; color: #8b949e; margin: 12px 0 0; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }

  /* Every generation, kept on disk. Sized by the .layout rule above. */
  .wihead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  /* `label` is a block with margins by default here — that's for the form column,
     not for a pair of radios, or a row of checkboxes, sitting on one line. */
  .wimodes { display: flex; gap: 14px; }
  .wimodes label, .checks label { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
  .wimodes input, .checks input { width: auto; padding: 0; accent-color: #388bfd; }
  .wihead button { margin: 0; width: auto; padding: 7px 12px; font-size: 13px; }
  /* Flex-wrap rather than a grid: only the height is fixed, and each thumbnail's
     width follows its own aspect ratio. A narrow gap, per the brief. */
  .wigrid { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 12px; }
  .wigrid button {
    margin: 0; padding: 0; width: auto; background: none; line-height: 0;
    border: 2px solid transparent; border-radius: 6px;
  }
  .wigrid img { height: 200px; width: auto; display: block; border-radius: 4px; }
  /* The image currently on screen. */
  .wigrid button.active { border-color: #388bfd; }
  /* Marked for deletion: red frame + a red cast, so a selection is obvious at a
     glance across a wide strip. Nothing is deleted until the button is pressed. */
  .wigrid button.sel { border-color: #f85149; }
  .wigrid button.sel img { filter: sepia(1) saturate(3) hue-rotate(-40deg) brightness(.85); }
  .wigrid.deleting button:hover { border-color: #f85149; }
</style>
</head>
<body>
<div class="app">
  <h1>rustimage</h1>
  <p class="sub">Vulkan · stable-diffusion.cpp + native FSR upscale — no Python.</p>

  <div class="layout">
  <div class="card col-controls">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="a lovely robot crab, cinematic lighting, sharp, in focus">a lovely robot crab, cinematic lighting, sharp, in focus</textarea>

    <label for="negative">Negative prompt (optional)</label>
    <input id="negative" placeholder="blurry, low quality" value="watermark, worst quality, low quality">

    <div class="row">
      <div>
        <label for="template">Model</label>
        <select id="template"></select>
      </div>
      <div>
        <label for="seed">Seed (-1 = random; click the seed under the image to reuse it)</label>
        <input id="seed" type="number" value="-1">
      </div>
    </div>


      <div class="row">
        <div>
          <label for="steps">Steps</label>
          <input id="steps" type="number" min="1" max="100">
        </div>
        <div>
          <label for="cfg">CFG scale</label>
          <input id="cfg" type="number" step="0.1" min="0">
        </div>
        <div>
          <label for="sampler">Sampler</label>
          <select id="sampler">
            <option value="euler">euler</option>
            <option value="euler_a">euler_a</option>
            <option value="dpm++2m">dpm++2m</option>
            <option value="dpm++2mv2">dpm++2mv2</option>
            <option value="lcm">lcm</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="w">Base width</label>
          <input id="w" type="number" step="64" min="64">
        </div>
        <div>
          <label for="h">Base height</label>
          <input id="h" type="number" step="64" min="64">
        </div>
      </div>
      <p class="sub" style="margin:8px 0 0">Turbo/LCM models: try steps 1–4, CFG 1.
        Standard SDXL: steps ~20, CFG ~5.</p>

      <div class="row">
        <div>
          <label for="rsteps">Refine steps</label>
          <input id="rsteps" type="number" min="0" max="100">
        </div>
        <div>
          <label for="rstrength">Refine strength</label>
          <input id="rstrength" type="number" step="0.05" min="0.05" max="0.95">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="hsteps">Hi-res steps</label>
          <input id="hsteps" type="number" min="0" max="100">
        </div>
        <div>
          <label for="hstrength">Hi-res strength</label>
          <input id="hstrength" type="number" step="0.05" min="0.05" max="0.95">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="icfg">Refine/hi-res CFG</label>
          <!-- Blank = follow the CFG box above. The placeholder shows what that
               currently resolves to, so an empty field still says what it does. -->
          <input id="icfg" type="number" step="0.1" min="0">
        </div>
      </div>
      <p class="sub" id="stepnote" style="margin:6px 0 0"></p>

      <!-- What the button does, as opposed to what the image is made of. Every
           image in a run is a separate request from this page, which is what
           lets results appear as they land and Stop wait only for the one in
           flight — see the comment over startRun(). -->
      <div class="run">
        <div class="row">
          <div>
            <label for="count">Images</label>
            <input id="count" type="number" min="1" step="1" value="1">
          </div>
          <div>
            <label for="runscale">Hi-res scale</label>
            <!-- The same factor as the select above the image, which doesn't
                 exist until something has been rendered — so a run that has
                 never rendered anything still needs somewhere to set it. -->
            <select id="runscale"></select>
          </div>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="autorun"> Keep going until stopped</label>
        </div>
        <!-- Off by default, all three: a run that quietly refined and saved
             everything would be spending GPU time nobody asked for. -->
        <label class="grouphead">After each image</label>
        <div class="checks">
          <label><input type="checkbox" id="opthires"> Hi-res pass</label>
          <label><input type="checkbox" id="optrefine"> Refine</label>
          <label><input type="checkbox" id="optsave"> Save to output</label>
        </div>
        <p class="sub" id="runnote" style="margin:8px 0 0"></p>
      </div>
    <button id="go">Generate</button>
    <!-- Deliberately not in IDLE_LABELS, so setBusy never touches it: a stop
         button that greys out for the length of the thing it stops is
         furniture. It hides itself again when the run ends. -->
    <button id="stop" class="danger" hidden>Stop</button>
    <div id="err" class="err"></div>
  </div>

  <div class="col-result">
    <div id="result" class="result"></div>

    <!-- Under the image, because that's what it acts on. These two never touch
         the diffusion: they re-filter the result that's already on screen. -->
    <div id="post" class="card" hidden>
      <div class="posthead">
        <b>Postprocessing</b><span id="postms" class="meta"></span>
      </div>
      <div class="slider">
        <label for="clarity">Clarity</label>
        <!-- Signed, like a photo editor's: left of centre softens. -->
        <input id="clarity" type="range" min="-1" max="1" step="0.01">
        <span class="val" id="clarityval"></span>
      </div>
      <div class="slider">
        <label for="sharpness">Sharpness</label>
        <input id="sharpness" type="range" min="0" max="1" step="0.01">
        <span class="val" id="sharpnessval"></span>
      </div>
    </div>
  </div>

  <!-- Every generation is kept on disk with the settings that made it, so the
       image you liked three renders ago is still one click away. Refined and
       hi-res results are not: those go to work/output/ only when asked.

       A third column of .layout rather than a row beneath it: it wraps under the
       other two on a narrower screen and rides beside them when there's room. -->
  <div class="workitems card">
    <div class="wihead">
      <b>Work items</b>
      <span class="wimodes">
        <label><input type="radio" name="wimode" value="open" checked> Click to open</label>
        <label><input type="radio" name="wimode" value="delete"> Click to delete</label>
      </span>
      <button id="widelete" class="danger" hidden></button>
    </div>
    <div id="wigrid" class="wigrid"></div>
  </div>
  </div>
</div>

<dialog id="lightbox"><img alt="full size result"></dialog>

<script>
const $ = (id) => document.getElementById(id);
let models = [];
// Server-side handle for the image currently on screen, used to escalate its
// quality; null before anything is generated, or once the handle goes stale.
let imageId = null;
// The data: URL on screen. Kept out of render()'s closure so the post-process
// sliders can swap the image without rebuilding the result block.
let currentSrc = null;
// The hi-res upscale factor. Module state rather than whatever the select
// happens to say, because render() rebuilds the whole .actions row on every
// generate, refine and hi-res — so a value living only in the DOM is reset by
// the very actions you'd want it to survive.
let upFactor = 2;
// The last /workitems listing, and which of them are marked for deletion. The
// listing carries each item's full settings, so opening one needs no second
// request; `workId` is the archive entry the image on screen came from.
let workItems = [];
const selected = new Set();
let workId = null;
// A run in flight — a batch, or the loop — else null. `total` is Infinity in
// loop mode, `stop` is set by the Stop button and read between images. It is
// also the flag everything else reads to know the GPU is spoken for.
let run = null;

// The grid renders user-supplied prompts into attributes, which nothing else on
// this page does — every other interpolation is a number from the server.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function currentModel() {
  return models.find((m) => m.name === $('template').value);
}

// Pre-fill the Advanced controls from the selected model's defaults.
function syncAdvanced() {
  const m = currentModel();
  if (!m) return;
  $('steps').value = m.steps;
  $('cfg').value = m.cfg_scale;
  // Left empty when the model doesn't set one, rather than pre-filled with the
  // number it resolves to. Pre-filling would look friendlier and would be a lie:
  // it pins the value, so moving the CFG box afterwards would silently stop
  // carrying over to the escalations.
  $('icfg').value = m.img2img_cfg_scale ?? '';
  $('sampler').value = m.sampler;
  $('w').value = m.base_width;
  $('h').value = m.base_height;
  $('rsteps').value = m.refine_steps;
  $('rstrength').value = m.refine_strength;
  $('hsteps').value = m.hires_steps;
  $('hstrength').value = m.hires_strength;
  setPost(m.sharpness, m.clarity);
  syncStepNote();
}

// The sliders are the only place these two live now, so they're also what
// /generate reads. Pre-filled from the model, then re-set from the server's
// reply — which is authoritative, since it says what the image actually has.
function setPost(sharpness, clarity) {
  $('sharpness').value = sharpness;
  $('clarity').value = clarity;
  syncPostLabels();
}

function syncPostLabels() {
  for (const id of ['sharpness', 'clarity']) {
    $(id + 'val').textContent = Number($(id).value).toFixed(2);
  }
}

// Mirror the step floor the server applies (see SdRunner::img2img): a pass that
// starts further up the noise schedule needs proportionally more steps, so the
// count in the box is a minimum. Showing the real number keeps the extra time a
// higher strength costs from being a surprise.
function effectiveSteps(steps, strength, base) {
  if (!(steps > 0)) return 0;
  return Math.max(steps, Math.ceil(base * strength));
}

function syncStepNote() {
  const base = parseFloat($('steps').value) || 0;
  const pass = (label, stepsId, strengthId) => {
    const n = parseFloat($(stepsId).value) || 0;
    const s = parseFloat($(strengthId).value) || 0;
    if (!(n > 0)) return `${label} off`;
    const eff = effectiveSteps(n, s, base);
    return `${label} runs ${eff} step${eff === 1 ? '' : 's'} at strength ${s}`
      + (eff > n ? ` (raised from ${n})` : '');
  };
  $('stepnote').textContent =
    pass('Refine', 'rsteps', 'rstrength') + ' · ' + pass('Hi-res', 'hsteps', 'hstrength')
    + cfgNote();
}

// A blank Refine/hi-res CFG box means "whatever the CFG box says", which is a
// thing the field has to admit to rather than decide quietly. So: the number it
// resolves to goes in the placeholder, and the note under the boxes states it —
// both live, because the base CFG it follows is one field away and editable.
function cfgNote() {
  const base = parseFloat($('cfg').value);
  const own = parseFloat($('icfg').value);
  $('icfg').placeholder = Number.isFinite(base) ? base : '';
  const cfg = Number.isFinite(own) ? own : base;
  if (!Number.isFinite(cfg)) return '';
  const differs = Number.isFinite(base) && cfg !== base;
  return ` · CFG ${cfg}` + (differs ? ` (base ${base})` : '');
}

async function loadModels() {
  try {
    models = await (await fetch('/models')).json();
    const sel = $('template');
    sel.innerHTML = '';
    for (const m of models) {
      const opt = document.createElement('option');
      opt.value = m.name;
      const tag = m.discovered ? 'discovered' : 'preset';
      opt.textContent = `${m.name} [${tag}] — ${m.out_width}×${m.out_height}`;
      sel.appendChild(opt);
    }
    if (!models.length) {
      $('err').textContent = 'No models found. Drop a .safetensors into the models/ folder.';
    }
    syncAdvanced();
  } catch (e) {
    $('err').textContent = 'Could not load models: ' + e;
  }
}

function bar(name, ms, max) {
  const pct = max > 0 ? Math.round((ms / max) * 100) : 0;
  return `<div class="bar"><span class="name">${name}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="val">${ms} ms</span></div>`;
}

const UPSCALES = [[1, '1× (same size)'], [1.5, '1.5×'], [2, '2×'], [3, '3×'], [4, '4×']];

// One factor, two places to set it: the select above the image, and the one in
// the run panel — which has to exist too, because the first is rebuilt by every
// render and so isn't there before the first image. Both are views of
// `upFactor`; this keeps them saying the same thing.
const upOptions = () => UPSCALES.map(([v, label]) =>
  `<option value="${v}"${v === upFactor ? ' selected' : ''}>${label}</option>`).join('');

function setUpFactor(v) {
  upFactor = v;
  for (const id of ['upfactor', 'runscale']) {
    if ($(id) && parseFloat($(id).value) !== v) $(id).value = v;
  }
  syncRunNote();
}

// Info first, image last: on a narrow screen the metadata and the action
// buttons stay visible without scrolling past a tall image.
function render(data) {
  const t = data.timings;
  const stages = [['generate', t.gen_ms], ['fsr', t.fsr_ms],
                  ['refine', t.refine_ms], ['hi-res', t.hires_ms]];
  const total = stages.reduce((sum, [, ms]) => sum + ms, 0);
  const max = Math.max(...stages.map(([, ms]) => ms), 1);
  const bars = stages.filter(([, ms]) => ms > 0)
    .map(([name, ms]) => bar(name, ms, max)).join('');

  imageId = data.image_id;
  // The seed box is left exactly as typed. Writing the drawn seed back into it
  // turns "-1" into a one-shot: you ask for random, get a number, and every
  // generate after that silently repeats the same image until you notice and
  // retype -1. The seed used is reported below and is one click from the box,
  // which covers the reason it was ever written back.
  // Hi-res first: it's the pass that enlarges, and refine is the finishing
  // touch you run on whatever size you ended up at.
  let actions = '';
  if (data.can_hires) {
    // From `upFactor`, not a hardcoded 2: this select is destroyed and rebuilt
    // on every render, so the choice has to live outside it to survive one.
    actions += `<select id="upfactor" title="Upscale before the hi-res pass">${upOptions()}</select>
      <button id="hires" class="secondary">Hi-res pass</button>`;
  }
  if (data.can_refine) {
    actions += '<button id="refine" class="secondary">Refine image</button>';
  }
  // Always offered, including for a plain generate — a base render can be worth
  // keeping too. Only generations are archived automatically; this is how a
  // refined or hi-res image gets kept.
  actions += '<button id="saveout" class="secondary">Save to output</button>';

  const times = n => n > 1 ? ` ×${n}` : '';
  const tags = (data.refine_passes ? ` · refined${times(data.refine_passes)}` : '')
    + (data.hires_passes ? ` · hi-res${times(data.hires_passes)}` : '');
  currentSrc = `data:image/png;base64,${data.image_base64}`;

  $('result').innerHTML = `
    <div class="meta"><b>${data.width}×${data.height}</b> · seed
      <b id="seedval" class="pin" title="Put this seed in the box, to generate it again">${data.seed}</b>
      · total <b>${total} ms</b>${tags}</div>
    <div class="bars">${bars}</div>
    ${actions ? `<div class="actions">${actions}</div>` : ''}
    <div id="saved" class="meta"></div>
    <div id="rerr" class="err"></div>
    <img src="${currentSrc}" alt="result" title="Click to view at full size">`;

  $('result').querySelector('img').addEventListener('click', () => showFullSize(currentSrc));
  // Opt-in reproducibility: pinning the seed is a thing you choose, not
  // something that happens to the box you just typed in.
  $('seedval').addEventListener('click', () => { $('seed').value = data.seed; });
  if ($('refine')) $('refine').addEventListener('click', refine);
  if ($('hires')) $('hires').addEventListener('click', hires);
  if ($('saveout')) $('saveout').addEventListener('click', saveOutput);
  if ($('upfactor')) {
    $('upfactor').addEventListener('change', (e) => setUpFactor(parseFloat(e.target.value)));
  }

  // Which archived generation this descends from, so the grid can show it.
  // Survives a refine or hi-res: those don't create a work item, they escalate
  // the one that's already on screen.
  workId = data.work_id ?? null;
  markGrid();

  // What the server actually applied — which after a generate is the model's
  // default, and after an escalation is whatever the sliders were left at.
  setPost(data.sharpness, data.clarity);
  $('postms').textContent = '';
  $('post').hidden = false;
}

// The image is already a data: URL on the page, so this re-uses it rather than
// fetching anything; the dialog scrolls it at its natural size.
function showFullSize(src) {
  const box = $('lightbox');
  box.querySelector('img').src = src;
  box.showModal();
  box.scrollTop = 0;
  box.scrollLeft = 0;
}

const IDLE_LABELS = {
  go: 'Generate', refine: 'Refine image', hires: 'Hi-res pass',
  saveout: 'Save to output',
};

// The GPU worker is serialized, so every action locks out together; only the
// one that started the work says what it's doing.
function setBusy(active, label) {
  for (const [id, idle] of Object.entries(IDLE_LABELS)) {
    const b = $(id);
    if (b) {
      b.disabled = !!active;
      b.textContent = id === active ? label : idle;
    }
  }
  // `IDLE_LABELS.go` is only a fallback: what the button says at rest depends on
  // the run panel, which the map can't know. Restoring it here means every path
  // back to idle goes through one place.
  if (!active) syncGoLabel();
  // Both views of the upscale factor, not just the one above the image: they
  // are one value, so leaving the run panel's copy live during a pass would let
  // the pair disagree about a number the next image is about to read.
  for (const id of ['upfactor', 'runscale']) {
    if ($(id)) $(id).disabled = !!active;
  }
  // The retained entry stays live during an escalation, so an adjust would
  // succeed and then be silently overwritten by the escalation's render.
  // Dropping a debounced one costs nothing: render() puts the sliders back to
  // what the server applied, which is where they already are.
  $('sharpness').disabled = !!active;
  $('clarity').disabled = !!active;
  if (active) clearTimeout(postTimer);
}

async function post(path, payload) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await resp.json();
  if (!resp.ok || data.error) {
    const err = new Error(data.error || ('HTTP ' + resp.status));
    err.status = resp.status;
    throw err;
  }
  return data;
}

// Escalate the quality of the image on screen. The server works from the
// intermediates it retained, so no stage is ever recomputed.
// Failures report next to the buttons that caused them: #err lives in the left
// control column, which on a wide screen is nowhere near the result. The slot is
// part of render()'s output, and render() only runs on success, so the one from
// the last successful render is still on the page to write into.
const escErr = (msg) => { ($('rerr') || $('err')).textContent = msg; };

async function escalate(which, path, payload, label) {
  if (imageId === null) return;
  setBusy(which, label);
  escErr('');
  try {
    render(await post(path, { image_id: imageId, ...payload }));
  } catch (e) {
    escErr(String(e.message || e));
    // 400 = the pass isn't available any more (evicted, or the server
    // restarted), so the controls are dead; keep the image on screen. Any
    // other failure is retryable — the server kept its intermediates.
    if (e.status === 400) {
      imageId = null;
      const row = document.querySelector('.actions');
      if (row) row.remove();
    }
  } finally {
    setBusy(null);
  }
}

// Post-process is the free rung of the ladder: no diffusion, just the display
// filters re-run on the image the server already has. That's cheap enough to
// drive from the slider itself rather than from a button.
let postBusy = false;   // a request is in flight
let postAgain = false;  // ...and the slider moved while it was
let postTimer = null;

// Debounce, then *coalesce*: while a request is out, later moves collapse into
// one follow-up with the latest values. The GPU worker is serialized, so a
// queue of drag positions would play back as a visible lag after letting go.
function schedulePost() {
  syncPostLabels();
  if (imageId === null) return;
  clearTimeout(postTimer);
  postTimer = setTimeout(runPost, 120);
}

async function runPost() {
  // `disabled` means an escalation is running; the follow-up from a coalesced
  // drag can land after one has started.
  if (imageId === null || $('sharpness').disabled) return;
  if (postBusy) { postAgain = true; return; }
  postBusy = true;
  try {
    const t0 = performance.now();
    const data = await post('/adjust', {
      image_id: imageId,
      sharpness: parseFloat($('sharpness').value),
      clarity: parseFloat($('clarity').value),
    });
    // Swap the pixels only. Rebuilding the result block would drop the image's
    // layout height for a frame, so the page would jump under the cursor on
    // every step of a drag.
    currentSrc = `data:image/png;base64,${data.image_base64}`;
    const img = $('result').querySelector('img');
    if (img) img.src = currentSrc;
    $('postms').textContent =
      `${Math.round(performance.now() - t0)} ms · gpu ${data.timings.fsr_ms} ms`;
    escErr('');
  } catch (e) {
    escErr(String(e.message || e));
    if (e.status === 400) { imageId = null; $('post').hidden = true; }
  } finally {
    postBusy = false;
    if (postAgain) { postAgain = false; runPost(); }
  }
}

// A blank box means "unset", which the server reads as "leave the retained value
// alone" — so an empty Advanced panel never overrides anything.
const numOr = (id) => {
  const v = parseFloat($(id).value);
  return Number.isFinite(v) ? v : null;
};

// The escalation knobs go with every refine/hi-res, not just with the generate
// that preceded them. The server starts from the profile the image was made with
// and folds these on top, so editing "Refine strength" and pressing Refine runs
// at the new number rather than silently re-using the old one.
//
// Only these five: steps, CFG, sampler and base size describe the txt2img that
// has already run, and there is nothing a new value could do to the image in
// hand. They stay as they are, and a later generate picks them up.
const escalateSettings = () => ({
  refine_steps: numOr('rsteps'),
  refine_strength: numOr('rstrength'),
  hires_steps: numOr('hsteps'),
  hires_strength: numOr('hstrength'),
  // Here null is a value, not an omission: clearing the box unsets the override
  // so the passes follow the CFG box again. Sending nothing would pin whatever
  // was last set, which is the one thing this field must never do.
  img2img_cfg_scale: numOr('icfg'),
});

const refine = () => escalate('refine', '/refine', escalateSettings(), 'Refining…');
const hires = () => escalate('hires', '/hires',
  { upscale: parseFloat($('upfactor').value), ...escalateSettings() }, 'Hi-res pass…');

// ---- Runs -------------------------------------------------------------------
//
// A run is one or more generations, plus whatever the "After each image" boxes
// ask for. It is driven from this page rather than by a server-side batch job on
// purpose. The GPU worker is a single blocking consumer, so one job that held it
// for a whole run would leave /adjust, the grid and every other client dead for
// the length of it, with nothing to cancel it by. Looping over the routes that
// already exist costs one round trip per image — nothing against a diffusion —
// and buys three things: each result on screen as it lands, a stop that only has
// to wait for the image in flight, and no new server code at all.
//
// The price is that the loop lives in the page: close the tab and it ends after
// the current image. For a local tool with the browser open that is a fair
// trade, and it does mean a runaway loop is always one tab-close from stopping.

const runTotal = () =>
  $('autorun').checked ? Infinity : Math.max(1, parseInt($('count').value, 10) || 1);

// The button does three different things, so it says three different things.
function syncGoLabel() {
  const n = runTotal();
  $('go').textContent =
    n === Infinity ? 'Start loop generation' : n > 1 ? `Generate ${n}` : 'Generate';
}

// State what the button will do, in a line, before it is pressed — the same job
// #stepnote does for the passes. Four controls interact here, and working out
// what they add up to isn't the user's job.
function syncRunNote() {
  const n = runTotal();
  const after = [
    $('opthires').checked ? `hi-res ${upFactor}×` : null,
    $('optrefine').checked ? 'refine' : null,
    $('optsave').checked ? 'save to output' : null,
  ].filter(Boolean);
  const seed = parseInt($('seed').value, 10);
  const walks = Number.isFinite(seed) && seed >= 0 && n > 1;
  $('runnote').textContent =
    (n === Infinity ? 'Generates until you press Stop'
      : `Generates ${n} image${n > 1 ? 's' : ''}`)
    + (after.length ? ` · after each: ${after.join(' → ')}` : '')
    + (walks ? ` · seeds ${seed}–${n === Infinity ? '…' : seed + n - 1}` : '');
}

// One image's request: exactly what a single Generate has always sent, plus the
// seed walk. A pinned seed advances by one per image, because a batch at a fixed
// seed is otherwise N copies of the same picture; image 0 is still precisely the
// seed in the box, which is the reason to pin one. -1 stays -1 and the server
// draws a fresh one each time.
function genPayload(index) {
  const seed = parseInt($('seed').value, 10);
  return {
    prompt: $('prompt').value,
    template: $('template').value,
    negative: $('negative').value || null,
    seed: Number.isFinite(seed) && seed >= 0 ? seed + index : -1,
    steps: numOr('steps'),
    cfg_scale: numOr('cfg'),
    sampler: $('sampler').value || null,
    width: numOr('w'),
    height: numOr('h'),
    // The same five the escalations send, from the same place — they set where
    // this image's passes start, and `/refine` and `/hires` can move them
    // afterwards. `img2img_cfg_scale` is among them, and null for an empty box
    // still means "leave it unset" here: the passes keep following cfg_scale
    // rather than getting pinned to whatever it resolves to today.
    ...escalateSettings(),
    // Not sharpness/clarity: those are post-process, not generation settings,
    // so a new image starts from the model's values rather than inheriting
    // wherever the last one's sliders were left.
  };
}

async function startRun() {
  if (run) return;
  run = { stop: false, done: 0, total: runTotal() };
  $('err').textContent = '';
  syncStopButton();
  try {
    while (!run.stop && run.done < run.total) {
      // Progress goes in the button that started it — the one control on the
      // page that is certainly still where the user is looking.
      const n = run.done + 1;
      const at = (what) =>
        `${what} ${n}${run.total === Infinity ? '' : '/' + run.total}…`;

      setBusy('go', at('Generating'));
      render(await post('/generate', genPayload(run.done)));
      // Only a generate creates a work item — refine and hi-res escalate the one
      // that's already there, and adjust doesn't touch the disk at all. Per
      // image rather than once at the end, so the strip fills as the run goes.
      loadWorkItems();

      // Hi-res before refine, the order the buttons are in and for the reason
      // they're in it: hi-res is the pass that enlarges, refine is the finishing
      // touch you run at whatever size you ended up at. Both read the Advanced
      // panel through the same escalateSettings() the buttons use, so an
      // automated pass and a manual one run identically.
      if ($('opthires').checked) {
        setBusy('go', at('Hi-res'));
        render(await post('/hires',
          { image_id: imageId, upscale: upFactor, ...escalateSettings() }));
      }
      if ($('optrefine').checked) {
        setBusy('go', at('Refining'));
        render(await post('/refine', { image_id: imageId, ...escalateSettings() }));
      }
      if ($('optsave').checked) {
        setBusy('go', at('Saving'));
        const saved = await post('/save-output', { image_id: imageId });
        $('saved').textContent = `saved → ${saved.path}`;
      }
      run.done += 1;
    }
  } catch (e) {
    // Deliberately not escalate()'s behaviour of reporting beside the image and
    // carrying on: a failure here is the run's failure. Whatever killed image 3
    // kills image 4 as well — VRAM, a missing checkpoint, a pass the model
    // hasn't got — and a hundred repeats of it help nobody. Everything already
    // generated is in the grid, and the message says what to change.
    $('err').textContent = String(e.message || e);
  } finally {
    run = null;
    setBusy(null);
    syncStopButton();
  }
}

// Stop after the image in flight has finished its whole pipeline. The hi-res,
// the refine and the save are that image, and dropping a refined one a single
// call short of saving it is not what anybody means by "stop".
function stopRun() {
  if (!run) return;
  run.stop = true;
  $('stop').disabled = true;
  $('stop').textContent = 'Stopping after this image…';
}

// Shown only while there is something to stop *between* — a single image is over
// when it's over. setBusy never touches it, so it stays clickable for the whole
// run, which is the entire point of it.
function syncStopButton() {
  const show = !!run && run.total > 1;
  $('stop').hidden = !show;
  if (show) {
    $('stop').disabled = false;
    $('stop').textContent = 'Stop';
  }
}

// Keep the image on screen. Everything generated is archived automatically, but
// a refine or hi-res is not — escalations are the expensive rungs, and most of
// them are experiments. This is how one stops being an experiment.
async function saveOutput() {
  if (imageId === null) return;
  setBusy('saveout', 'Saving…');
  escErr('');
  try {
    const data = await post('/save-output', { image_id: imageId });
    $('saved').textContent = `saved → ${data.path}`;
  } catch (e) {
    escErr(String(e.message || e));
  } finally {
    setBusy(null);
  }
}

// ---- Work items -----------------------------------------------------------

const deleteMode = () =>
  document.querySelector('input[name=wimode]:checked').value === 'delete';

async function loadWorkItems() {
  try {
    const data = await (await fetch('/workitems')).json();
    // A 500 answers with {"error": …}, not a list. Everything below assumes an
    // array, and a TypeError here would take the whole page's wiring with it.
    if (!Array.isArray(data)) throw new Error(data.error || 'unexpected response');
    workItems = data;
  } catch (e) {
    workItems = [];
    $('err').textContent = 'Could not load work items: ' + (e.message || e);
  }
  // Drop marks on items that are no longer there, so a stale id can't ride along
  // in the next delete request.
  for (const id of [...selected]) {
    if (!workItems.some((w) => w.id === id)) selected.delete(id);
  }
  renderWorkItems();
}

function renderWorkItems() {
  const grid = $('wigrid');
  if (!workItems.length) {
    grid.innerHTML = '<p class="sub" style="margin:0">No work items yet — generate something.</p>';
    syncDeleteButton();
    return;
  }
  // width/height on every thumbnail so the strip reserves its space up front and
  // doesn't reflow, row by row, as the images decode. `loading="lazy"` for the
  // other end of the same problem: a loop left running overnight leaves hundreds
  // of entries here, and there is no reason for the page to hold a decoded copy
  // of each. With the dimensions already declared, deferring them costs nothing.
  grid.innerHTML = workItems.map((w) => `
    <button type="button" data-id="${esc(w.id)}"
      title="${esc(w.prompt)}&#10;${w.width}×${w.height} · seed ${w.seed} · ${esc(w.template)}">
      <img src="/workitems/${esc(w.id)}/thumb.png" alt="" loading="lazy"
        width="${w.thumb_width}" height="${w.thumb_height}"></button>`).join('');
  for (const b of grid.querySelectorAll('button')) {
    b.addEventListener('click', () => clickWorkItem(b.dataset.id));
  }
  markGrid();
}

function markGrid() {
  for (const b of $('wigrid').querySelectorAll('button')) {
    b.classList.toggle('sel', selected.has(b.dataset.id));
    b.classList.toggle('active', b.dataset.id === workId);
  }
  syncDeleteButton();
}

function syncDeleteButton() {
  const n = selected.size;
  $('widelete').hidden = n === 0;
  $('widelete').textContent = `Delete ${n} selected`;
}

// In delete mode a click only *marks*: nothing is destroyed until the button
// above the grid is pressed. That makes culling a batch one click per image plus
// one at the end, with the marks visible the whole time — rather than a
// confirmation dialog per image, or a single misclick that can't be taken back.
async function clickWorkItem(id) {
  if (deleteMode()) {
    if (!selected.delete(id)) selected.add(id);
    markGrid();
    return;
  }
  // Marking for deletion stays live during a run — it touches nothing the run
  // uses — but opening does not. The buttons are disabled while a run is going;
  // the thumbnails aren't, and an open would queue behind the generation in
  // flight only to have its render replaced by the next image.
  if (run) return;
  const item = workItems.find((w) => w.id === id);
  if (!item) return;
  setBusy('go', 'Opening…');
  $('err').textContent = '';
  try {
    applyWorkItem(item);
    render(await post('/workitems/open', { id }));
  } catch (e) {
    $('err').textContent = String(e.message || e);
  } finally {
    setBusy(null);
  }
}

// Put an item's stored settings back in the controls. The server independently
// restores the same profile onto the reopened image, so this is only about what
// the boxes say — but they have to agree, or the next Generate would silently
// differ from the image beside it.
function applyWorkItem(item) {
  const p = item.profile;
  $('prompt').value = item.prompt;
  $('negative').value = item.negative ?? '';
  $('seed').value = item.seed;
  // Assigned directly, and deliberately without firing `change`: that listener
  // is syncAdvanced, which would overwrite every field below with the model's
  // defaults — the exact opposite of restoring this item.
  if (models.some((m) => m.name === item.template)) $('template').value = item.template;
  $('steps').value = p.steps;
  $('cfg').value = p.cfg_scale;
  // Blank stays blank, for the reason syncAdvanced gives: a pre-filled number
  // pins the value and quietly stops it following the CFG box.
  $('icfg').value = p.img2img_cfg_scale ?? '';
  $('sampler').value = p.sampler;
  $('w').value = p.width;
  $('h').value = p.height;
  $('rsteps').value = p.refine_steps;
  $('rstrength').value = p.refine_strength;
  $('hsteps').value = p.hires_steps;
  $('hstrength').value = p.hires_strength;
  // Not the sliders: render() sets those from what the server actually applied.
  syncStepNote();
}

async function deleteSelected() {
  const ids = [...selected];
  if (!ids.length) return;
  $('widelete').disabled = true;
  try {
    await post('/workitems/delete', { ids });
    selected.clear();
    // The image on screen is deliberately left alone if it was one of them: the
    // server still holds its intermediates, so refine and the sliders keep
    // working. It just has no archive entry to go back to any more.
    await loadWorkItems();
  } catch (e) {
    $('err').textContent = String(e.message || e);
  } finally {
    $('widelete').disabled = false;
  }
}

$('widelete').addEventListener('click', deleteSelected);
for (const r of document.querySelectorAll('input[name=wimode]')) {
  r.addEventListener('change', () => {
    // Leaving delete mode clears the marks. A selection you can't see is one you
    // could act on later without meaning to.
    if (!deleteMode()) selected.clear();
    $('wigrid').classList.toggle('deleting', deleteMode());
    markGrid();
  });
}

$('go').addEventListener('click', startRun);
$('stop').addEventListener('click', stopRun);
// The run panel's view of the shared upscale factor. Built here rather than in
// the markup so there is one list of factors on the page.
$('runscale').innerHTML = upOptions();
$('runscale').addEventListener('change', (e) => setUpFactor(parseFloat(e.target.value)));
// 'input' covers the checkboxes too, and keeps the count responsive per keystroke
// rather than on blur — the button's own label is the feedback.
for (const id of ['count', 'autorun']) {
  $(id).addEventListener('input', () => { syncGoLabel(); syncRunNote(); });
}
// The seed is in here because a pinned one walks across a batch, and the note is
// where that's stated.
for (const id of ['opthires', 'optrefine', 'optsave', 'seed']) {
  $(id).addEventListener('input', syncRunNote);
}
// Each model carries its own defaults, so re-fill the controls on switch.
$('template').addEventListener('change', syncAdvanced);
// Keep the effective-step line live as either pair is edited — and the CFG boxes
// with them, since the note reports what the img2img passes resolve to.
for (const id of ['steps', 'rsteps', 'rstrength', 'hsteps', 'hstrength', 'cfg', 'icfg']) {
  $(id).addEventListener('input', syncStepNote);
}
// 'input', not 'change': the point is to see the filter while dragging.
for (const id of ['sharpness', 'clarity']) {
  $(id).addEventListener('input', schedulePost);
}
// Click anywhere in the viewer to dismiss it; <dialog> handles Escape itself.
$('lightbox').addEventListener('click', () => $('lightbox').close());
loadModels();
// Independent of the model list: the grid is what survived the last restart.
loadWorkItems();
// Both are labels for controls that start with a value, so neither can wait for
// the first edit to say what it does.
syncGoLabel();
syncRunNote();
</script>
</body>
</html>
