# yasdig.com: built from site/ by site/build.mjs (Node, no packages) into
# _site/, deployed to GitHub Pages. Kept apart from docs/ (the Markdown
# reference), so GitHub's Jekyll never renders those, and from release.yml.
# The custom domain is site/CNAME plus the repo's Settings → Pages → Custom
# domain; DNS points yasdig.com at GitHub Pages.

name: pages

on:
  push:
    branches: [master]
    # The site, and the app files it is built from: the Help topics become
    # /guide/, and the tokens are the site's palette.
    paths: ["site/**", "web/js/help.js", "web/tokens.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the site
        run: node site/build.mjs
      # The README's VirusTotal badge, served from here: shields.io won't fetch
      # from github.com, so the newest release's badge.json (scan.yml) is
      # copied into the site. A release with none yet leaves the badge as the
      # last deploy had it — or absent, which shields shows as an error.
      - name: VirusTotal badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern badge.json --dir _site || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
