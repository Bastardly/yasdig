# yasdig.com: the static page in site/, deployed to GitHub Pages. Kept apart
# from docs/ (the Markdown reference), so GitHub's Jekyll never renders those,
# and from release.yml. The custom domain is site/CNAME plus the repo's
# Settings → Pages → Custom domain; DNS points yasdig.com at GitHub Pages.

name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
