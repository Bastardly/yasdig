# The one-file release: stable-diffusion.cpp's sd-cli built static, then baked
# into yasdig (see build.rs and src/bundle.rs), for Linux and Windows.
#
# Draft a release on GitHub with a new `v*` tag (or push one), and both
# archives (a `yasdig/` folder holding the program and a README) are attached
# to it when the builds finish, ~15 minutes later. A
# tag not starting with `v` builds nothing. Run it by hand from the Actions tab
# to get the files as workflow artifacts only.
#
# Three flags on the sd.cpp build are what make the result travel, and all three
# fail on *someone else's* machine rather than here:
#   GGML_NATIVE=OFF   a native build uses this runner's CPU instructions and dies
#                     with "illegal instruction" on an older CPU.
#   GGML_OPENMP=OFF   OpenMP is a runtime library (libgomp, vcomp140.dll) that
#                     isn't on every system. ggml's own thread pool replaces it.
#   static runtime    -static-libstdc++ on Linux, /MT on Windows — no libstdc++
#                     version mismatch, no VC++ redistributable to install.
# What is left is the Vulkan loader, which every GPU driver installs, and libc.
# The "dependencies" step checks exactly that, so a regression fails here.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the two build jobs only check out and compile. The
# `publish` job, which attaches the archives, asks for write on its own.
permissions:
  contents: read

env:
  # The sd.cpp commit yasdig is tested against. Bump deliberately: yasdig
  # parses sd-cli's progress output and reads its source for several behaviours
  # (see CLAUDE.md), so a newer commit is a change to test, not a free upgrade.
  SD_CPP_REF: f89d9b13d730eabeede7314ce49dacd18d3c90c2
  VULKAN_VERSION: 1.4.328.1
  # SHA-256 of the two SDK downloads for VULKAN_VERSION, as LunarG publishes
  # them (sdk.lunarg.com/sdk/sha/<version>/<platform>/<file>.json) and checked
  # against the files on 2026-10-13. Change them together with the version.
  VULKAN_SHA256_LINUX: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
  VULKAN_SHA256_WINDOWS: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c

jobs:
  linux:
    # The oldest supported runner: glibc is linked dynamically, and a binary
    # runs on systems with the glibc it was built against *or newer*.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        # The LunarG SDK rather than apt: 22.04's Vulkan headers are older than
        # ggml-vulkan wants, and the SDK brings glslc with it.
        run: |
          cd "$RUNNER_TEMP"
          curl -sL -o vulkansdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "${VULKAN_SHA256_LINUX}  vulkansdk.tar.xz" | sha256sum -c -
          tar -xf vulkansdk.tar.xz
          SDK="$RUNNER_TEMP/${VULKAN_VERSION}/x86_64"
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDK/lib" >> "$GITHUB_ENV"

      - name: Fetch stable-diffusion.cpp
        # Where build.rs looks for it, so the build below is the same
        # `cargo build --release` as on a desk.
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp
          git -C stable-diffusion.cpp checkout "$SD_CPP_REF"
          git -C stable-diffusion.cpp submodule update --init --recursive

      # Third-party actions are pinned to a commit, not a movable tag or branch:
      # a moved tag would run someone else's code inside the release build.
      # The comment says what the hash was when pinned; bump both together.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-13

      - name: Build
        # LDFLAGS is read by cmake's first configure: a static libstdc++ here,
        # where the runner has it, and not in build.rs, because Fedora doesn't.
        env:
          LDFLAGS: -static-libstdc++ -static-libgcc
        run: |
          cargo build --release
          echo "SD_CLI=stable-diffusion.cpp/build-yasdig/bin/sd-cli" >> "$GITHUB_ENV"

      - name: Dependencies
        # Anything beyond the Vulkan loader and glibc's own libraries is a
        # library the person running this may not have.
        run: |
          ldd "$SD_CLI"
          if ldd "$SD_CLI" | grep -vE 'linux-vdso|ld-linux|lib(c|m|dl|pthread|rt)\.so|libvulkan\.so'; then
            echo "::error::sd-cli links a library that won't be on every system"; exit 1
          fi

      - name: Test
        run: cargo test

      - name: Package
        # A folder rather than a bare file: the folder beside the program is
        # its home, so the download arrives as the thing to keep. A tar keeps
        # the executable bit, which is why this is a .tar.gz and not a zip —
        # no `chmod +x` for the person downloading it.
        run: |
          mkdir -p pkg/yasdig
          cp target/release/yasdig pkg/yasdig/yasdig
          chmod +x pkg/yasdig/yasdig
          cp packaging/README.txt pkg/yasdig/
          tar -C pkg -czf yasdig-linux-x86_64.tar.gz yasdig
          tar -tvzf yasdig-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: yasdig-linux-x86_64
          path: yasdig-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        # The installer and flags upstream's own CI uses.
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          $sha = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\VulkanSDK-Installer.exe").Hash.ToLower()
          if ($sha -ne $env:VULKAN_SHA256_WINDOWS) { Write-Error "Vulkan SDK installer checksum mismatch: $sha"; exit 1 }
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Fetch stable-diffusion.cpp
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp
          git -C stable-diffusion.cpp checkout $env:SD_CPP_REF
          git -C stable-diffusion.cpp submodule update --init --recursive

      # Pinned to a commit, as in the Linux job.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-13

      - name: Build
        # The static CRT for yasdig itself too; build.rs gives sd-cli /MT.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          $exe = Get-ChildItem -Recurse stable-diffusion.cpp\build-yasdig\bin -Filter sd-cli.exe | Select-Object -First 1
          Add-Content $env:GITHUB_ENV "SD_CLI=$($exe.FullName)"

      - name: Dependencies
        # vulkan-1.dll comes with every GPU driver; KERNEL32 and the rest are
        # Windows itself. A VCRUNTIME/MSVCP or vcomp DLL here means /MT or the
        # OpenMP switch didn't take.
        run: |
          $deps = dumpbin /dependents $env:SD_CLI | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
          $deps
          $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|vcomp|libgomp|libstdc)' }
          if ($bad) { Write-Error "sd-cli needs a runtime DLL users won't have: $bad"; exit 1 }

      - name: Test
        run: cargo test

      - name: Package
        # A zip, not a bare .exe: Edge's SmartScreen warns hard about
        # downloading an unsigned executable and much less about an archive.
        # The first start still shows "Windows protected your PC" until the
        # program is signed. `-Path` names the folder, so the zip's root is
        # `yasdig\` — extracted, it is the app's home.
        run: |
          New-Item -ItemType Directory pkg\yasdig | Out-Null
          Copy-Item target\release\yasdig.exe pkg\yasdig\yasdig.exe
          Copy-Item packaging\README.txt pkg\yasdig\
          Compress-Archive -Path pkg\yasdig -DestinationPath yasdig-windows-x86_64.zip
          Get-Item yasdig-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yasdig-windows-x86_64
          path: yasdig-windows-x86_64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        # Two ways in, both ending with the archives attached: a release
        # drafted by hand on GitHub (its tag push started this run, and its
        # title, notes and pre-release tick are kept — the files are uploaded
        # to it), or a bare `git push origin v…` (the release is created here).
        # `gh release create` alone failed on the first, since the release
        # already existed by the time the builds were done.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="yasdig-linux-x86_64.tar.gz yasdig-windows-x86_64.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $files
          fi
