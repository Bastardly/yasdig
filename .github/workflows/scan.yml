# VirusTotal for a release's Linux download: the archive, and the program
# inside it, so both what is downloaded and what runs have a report. Windows
# isn't scanned (since 2026-11-01): an unsigned exe draws a guess-flag from an
# engine or two on every release, and without a certificate there is no way to
# stop that, so its report said nothing about the file. The results go into the
# release (`scan-notes.sh`: a visible section, and a JSON comment yasdig.com
# reads), plus `scan.json`, `badge.json` (the README's badge) and, for a
# release older than this, `SHA256SUMS`.
#
# Called by release.yml after `publish`; run by hand from the Actions tab to
# scan (or re-scan) any tag. Needs the repository secret VT_API_KEY — a free
# VirusTotal account's Public API key.

name: scan

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: write
  # To redeploy yasdig.com, which serves the README's badge (pages.yml).
  actions: write

jobs:
  virustotal:
    runs-on: ubuntu-latest
    # One scan at a time: they share the key's 4 calls a minute, so a second
    # one waits rather than running into the first's rate limit.
    concurrency:
      group: virustotal
      cancel-in-progress: false
    # Uploads, then waits for up to four analyses at the Public API's pace.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the archives
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            -p 'yasdig-linux-x86_64.tar.gz' -p 'yasdig-windows-x86_64.zip'
          mkdir -p prog/linux
          tar -xzf dl/yasdig-linux-x86_64.tar.gz -C prog/linux yasdig/yasdig
          ls -l dl prog/linux/yasdig

      # Releases from before the checksums were part of `publish` — the
      # reason the Windows zip is still downloaded.
      - name: Checksums
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx SHA256SUMS; then
            (cd dl && sha256sum yasdig-linux-x86_64.tar.gz yasdig-windows-x86_64.zip > ../SHA256SUMS)
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS
          fi

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          bash .github/scripts/virustotal.sh \
            archive:linux:dl/yasdig-linux-x86_64.tar.gz \
            program:linux:prog/linux/yasdig/yasdig \
            | jq -s --arg tag "$TAG" '{tag: $tag, files: .}' > scan.json
          cat scan.json

      # The README's VirusTotal badge: shields.io's endpoint format, read from
      # the newest release (`releases/latest/download/badge.json`), so it
      # follows every release with nothing to edit. Green when no engine
      # flagged either file, amber when some did, grey while one is
      # still being scanned.
      - name: Badge
        run: |
          jq '[.files[] | select(.status == "completed")] as $done
            | ($done | map(.malicious + .suspicious) | add // 0) as $n
            | {schemaVersion: 1, label: "VirusTotal",
               message: (if ($done | length) < (.files | length) then "scanning"
                         elif $n == 0 then "clean" else "\($n) flagged" end),
               color: (if ($done | length) < (.files | length) then "lightgrey"
                       elif $n == 0 then "brightgreen" else "orange" end)}' scan.json > badge.json
          cat badge.json

      - name: Into the release
        run: |
          bash .github/scripts/scan-notes.sh "$TAG" scan.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber scan.json badge.json

      # yasdig.com serves the badge (shields.io won't read from github.com):
      # deploying again picks up the newest release's badge.json.
      - name: Redeploy the site
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
