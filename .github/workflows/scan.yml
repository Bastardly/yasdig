# VirusTotal for a release's Linux download: the archive, and the program
# inside it. Windows isn't scanned (since 2026-11-01): an unsigned exe draws a
# guess-flag from an engine or two on every release, and without a certificate
# there is no way to stop that.
#
# **The result stays in this run** (since 2026-11-25): the job summary, a
# warning annotation when an engine flags something, and `scan.json` as the
# run's artifact. It is no longer put in the release notes, on yasdig.com or
# in a README badge: v0.13.1's program drew Microsoft's machine-learning guess
# `Trojan:Script/Wacatac.C!ml` (1 of 62, the archive holding it 0 of 61), and
# to most visitors "1 engine flagged it" reads as "a trojan". So this is a
# check for us — a real detection would show here first.
#
# Called by release.yml after `publish`; run by hand from the Actions tab to
# scan (or re-scan) any tag. Needs the repository secret VT_API_KEY — a free
# VirusTotal account's Public API key.

name: scan

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  virustotal:
    runs-on: ubuntu-latest
    # One scan at a time: they share the key's 4 calls a minute, so a second
    # one waits rather than running into the first's rate limit.
    concurrency:
      group: virustotal
      cancel-in-progress: false
    # Uploads, then waits for up to two analyses at the Public API's pace.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the archive
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            -p 'yasdig-linux-x86_64.tar.gz'
          mkdir -p prog/linux
          tar -xzf dl/yasdig-linux-x86_64.tar.gz -C prog/linux yasdig/yasdig
          ls -l dl prog/linux/yasdig

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          bash .github/scripts/virustotal.sh \
            archive:linux:dl/yasdig-linux-x86_64.tar.gz \
            program:linux:prog/linux/yasdig/yasdig \
            | jq -s --arg tag "$TAG" '{tag: $tag, files: .}' > scan.json
          cat scan.json

      # A flag is a warning on the run, not a failure: the release is already
      # public, and most flags are one engine's guess. Open the report and
      # read the detection name before acting (a `!ml` suffix is Microsoft's
      # machine-learning guess, not a signature).
      - name: Summary
        run: |
          jq -r '
            def verdict: if .status != "completed" then "still being scanned"
              elif (.malicious + .suspicious) == 0 then "0 of \(.engines) engines flagged it"
              else "**\(.malicious + .suspicious) of \(.engines)** engines flagged it" end;
            "## VirusTotal — \(.tag)", "",
            "| File | Result | Report |", "|---|---|---|",
            (.files[] | "| `\(.name)` | \(verdict) | [report](\(.report)) |")
          ' scan.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.files[] | select(.status == "completed" and (.malicious + .suspicious) > 0)
            | "::warning title=VirusTotal::\(.name): \(.malicious + .suspicious) of \(.engines) engines flagged it — \(.report)"' scan.json

      - uses: actions/upload-artifact@v7
        with:
          name: scan-${{ inputs.tag }}
          path: scan.json
