# ---------------------------------------------------------------------------
# Video models (nightly): the Video tab's families, served only while that tab
# is on. Same shape as `[[entry]]`, with three differences: `family` is a
# `VideoFamily` name, `dest` is relative to the video dir (`[sd].video_dir`,
# `models/video/` by default) — where discovery assembles a video model from —
# and the A14B's second expert is `slot = "high_noise"`, its file name keeping
