# The Get models tab's catalog: a set of files per family — sometimes two, in
# different precisions, the first being the one Help's family table names — and
# the only URLs the downloader will fetch (src/catalog.rs, src/downloads.rs).
# `recommended = true` marks the cards a newcomer should start from, and
# `card_gb` is roughly what a card's set occupies on the GPU: a recommended card
# is marked only where it fits the GPU's VRAM (`Catalog::recommended`), and one
# with `recommend_below_gb` only on a GPU smaller than that.
#
# Every URL and `bytes` here was checked against Hugging Face on 2026-10-10
# (MOSS-Image on 2026-10-20) — the repo's file listing for the exact name, and a
# HEAD request through the redirect for a 200 and its Content-Length. Ungated repos only, so no account or token is
# needed. A file several families share — Flux's `ae`, the Flux.2 VAE, the Wan
# 2.1 VAE Krea 2 and Qwen-Image decode with — is fetched from a repo *of the
# card's own model*, because the card links that repo as where the licence is,
# and a Flux card pointing at a Z-Image repo reads as a mistake. They share a
# `dest`, so they must be one file: `sha256` (Hugging Face's X-Linked-Etag) is
# required on each and must agree, and `catalog_is_consistent` refuses a shared
# dest without it. Black Forest Labs' own copies answer 401 (gated), so Flux's
# `ae` comes from second-state's mirrors, the same bytes.
#
# `slot` is "model", or a key of that family's `ImageFamily::slots()` ("vae",
# "llm", "clip_l", "t5xxl", "tokenizer" — the one `.json` dest allowed). A part
# that some file on disk already fits counts as had, whatever its name, so a shared encoder is downloaded once. The picks are
# docs/configuration.md's: what fits a 24 GB card with the model and its encoders resident.

