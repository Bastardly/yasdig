[package]
name = "rustimage"
version = "0.1.0"
edition = "2021"
description = "Python-free Vulkan image generator: stable-diffusion.cpp + native FSR post-process"

[[bin]]
name = "rustimage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
anyhow = "1"

[profile.release]
opt-level = 3
