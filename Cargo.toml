[package]
name = "yasdig"
version = "0.5.4"
license = "Apache-2.0"
edition = "2021"
description = "Yet Another Stable Diffusion Image Generator: Python-free, Vulkan, stable-diffusion.cpp + native FSR post-process"

[[bin]]
name = "yasdig"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
anyhow = "1"

# The sd-cli network sandbox (`src/sandbox.rs`) on Linux; already in the tree via wgpu.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The Windows side of it: an AppContainer. Already in the tree via wgpu.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Shader validation in tests. The WGSL is otherwise only compiled when a GPU
# device is created, so a typo would surface as a startup failure on the worker
# thread rather than at build time. Pinned to the naga wgpu 27 uses.
[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
