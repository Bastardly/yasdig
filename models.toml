# rustimage configuration.
#
# You usually don't need to touch [defaults] or [templates] — just drop model
# files into the models dir and they're auto-detected. See below for tuning.

[sd]
# Path to the compiled stable-diffusion.cpp CLI. Newer builds name it `sd-cli`;
# older ones `sd`. Point this at whatever your build produced (absolute or
# relative to this project root).
binary = "../stable-diffusion.cpp/build/bin/sd-cli"
# Mode flag value. Newer sd.cpp uses "img_gen" for both txt2img and img2img
# (img2img is triggered by an init image). Older builds used "txt2img".
mode = "img_gen"
# Folder scanned for checkpoints (.safetensors / .ckpt / .gguf). Every file here
# is auto-listed in the UI. Point it elsewhere, or symlink models in, if you like.
models_dir = "models"

[server]
host = "127.0.0.1"
port = 8080

# ---------------------------------------------------------------------------
# [defaults] — settings applied to every auto-discovered checkpoint. Tuned for
# standard (non-distilled) SDXL. You can override any of these per-generation
# from the UI's Advanced panel (handy for Turbo/LCM models that want few steps
# and cfg 1). FSR upscale/sharpen + the optional refine pass live here too.
# ---------------------------------------------------------------------------
[defaults]
width          = 768
height         = 768
steps          = 20
cfg_scale      = 5.0
sampler        = "euler"
upscale_factor = 2.0          # FSR: 768 -> 1536
# RCAS sharpness: 0.0 = off (the pass is an exact identity), 1.0 = RCAS at full
# strength. RCAS's limiter rules out ringing, so the top of the range is usable —
# unlike the CAS pass this replaced, where high values haloed. Applied once, to
# the finished image — each pass keeps an unsharpened copy for the next one to
# work from, so sharpening can't stack up over a long escalation chain.
sharpness      = 0.35
# Local contrast, 0.0 = off. A wide unsharp mask on brightness only: it moves the
# mid frequencies that read as contrast and depth and leaves the fine band alone,
# which is the opposite end of the spectrum from sharpness above. Reach for it
# when an image looks flat. Worth knowing why it exists: a low-strength img2img
# enters the schedule at low sigma and so only ever rebuilds fine texture — depth
# is the one thing the refine pass structurally cannot give you, and raising
# strength to reach it re-composes the picture instead. This is deterministic and
# invents nothing, so it has neither problem.
clarity        = 0.0
# "Refine image": a low-denoise img2img pass over the current image, at whatever
# size it currently is and with no rescale (0 steps = disabled). That makes it
# the finishing rung — it can follow a hi-res pass, and it can repeat. At output
# resolution this is a hires-fix-style pass, so strengths in the 0.20..0.35 range
# are conventional; it used to run at base resolution, where a much lighter touch
# was right because the upscale afterwards smeared most of it away anyway.
# Steps are a *floor* on effective denoising steps, not an exact count: strength
# decides how far up the noise schedule the pass starts, and starting higher
# needs proportionally more steps to resolve, so the count is raised to at least
# `steps * strength`. Too few steps for the strength leaves un-removed noise
# behind, which reads as grit. rustimage also scales the schedule it hands sd.cpp
# by 1/strength, since sd.cpp trims img2img schedules rather than scaling them.
# Strength must be 0.05..0.95 — at exactly 1.0 sd.cpp skips the trim and discards
# the init image, which makes the pass a plain txt2img.
refine_steps    = 2
refine_strength = 0.05
# "Hi-res pass": a second img2img at the OUTPUT resolution, which is what adds
# detail the FSR upscale can't invent. Optionally enlarges first (the UI picks a
# factor up to 4×). 0 steps = disabled, and no button appears. Effective steps,
# same as refine_steps above — this is the pass that decides how sharp the
# result looks, so raise it before reaching for sharpness.
hires_steps     = 8
hires_strength  = 0.30
# Longest side the HI-RES pass may diffuse at. Anything beyond it is reached with
# a final FSR upscale instead — past ~2048 SDXL's quality drops and the cost
# climbs quadratically. Measured on a 7900 XTX at 8 steps: 1536² ≈ 12 s,
# 2048² ≈ 20 s (both ~10 GB VRAM, with flash attention below).
# Refine is NOT under this ceiling: it doesn't rescale, so it has nowhere to fall
# back to, and an image FSR has stretched past its last diffusion is exactly the
# one worth refining. It will happily run at 3072² if you ask it to — watch VRAM.
hires_max_side  = 2048
# Flash attention for the img2img passes, whenever they run large enough to need
# the memory flags. Worth 6× at 2048² (122 s -> 20 s); turn it off only if your
# GPU/driver can't do it.
hires_flash_attn = true
# weight_type  = "q8_0"       # optional on-the-fly quantization
# extra_args   = ["--diffusion-fa"]

# ---------------------------------------------------------------------------
# [templates.<name>] — OPTIONAL tuned presets that override the defaults for one
# specific checkpoint (matched by `model` path). Use these for models that need
# non-default settings, e.g. a Turbo checkpoint:
# ---------------------------------------------------------------------------
# [templates.sdxl-turbo]
# description    = "SDXL-Turbo — fast draft (512 → 1024)"
# model          = "models/sdxl-turbo.safetensors"
# width          = 512
# height         = 512
# steps          = 4
# cfg_scale      = 1.0          # Turbo models want CFG 1
# sampler        = "euler"
# upscale_factor = 2.0
# sharpness      = 0.35
# refine_steps    = 2
# refine_strength = 0.30
# hires_steps     = 6           # Turbo models need fewer steps here too
# hires_strength  = 0.30
