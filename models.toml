# rustimage configuration.
#
# You usually don't need to touch [defaults] or [templates] — just drop model
# files into the models dir and they're auto-detected. See below for tuning.

[sd]
# Path to the compiled stable-diffusion.cpp CLI. Newer builds name it `sd-cli`;
# older ones `sd`. Point this at whatever your build produced (absolute or
# relative to this project root).
binary = "../stable-diffusion.cpp/build/bin/sd-cli"
# Mode flag value. Newer sd.cpp uses "img_gen" for both txt2img and img2img
# (img2img is triggered by an init image). Older builds used "txt2img".
mode = "img_gen"
# Folder scanned for checkpoints (.safetensors / .ckpt / .gguf). Every file here
# is auto-listed in the UI. Point it elsewhere, or symlink models in, if you like.
models_dir = "models"

[server]
host = "127.0.0.1"
port = 8080

# ---------------------------------------------------------------------------
# [defaults] — settings applied to every auto-discovered checkpoint. Tuned for
# standard (non-distilled) SDXL. You can override any of these per-generation
# from the UI's Advanced panel (handy for Turbo/LCM models that want few steps
# and cfg 1). FSR upscale/sharpen + the optional refine pass live here too.
# ---------------------------------------------------------------------------
[defaults]
width          = 768
height         = 768
steps          = 4
cfg_scale      = 1.0
# CFG for the refine and hi-res passes only. Unset = use cfg_scale above, which is
# what it does today, so leaving this commented changes nothing.
# Worth trying, though: the CFG that suits a 768² base render over-guides at output
# resolution — the pass has little freedom left to start with, and pushing it hard
# against the prompt spends that freedom on high-frequency artifacts. That reads as
# the same crunch under-stepping produces, from the other direction. ~2-3 is the
# conventional cure. 0 is legal and means guidance off.
# img2img_cfg_scale = 2.5
sampler        = "euler"
upscale_factor = 2.0          # FSR: 768 -> 1536
# RCAS sharpness: 0.0 = off (the pass is an exact identity), 1.0 = RCAS at full
# strength — literally, since FSR parameterizes sharpness as exp2(-stops) and 1.0
# is 0 stops. There is nothing above it: a bigger lobe than the limiter allows
# doesn't sharpen harder, it inverts the filter. What 1.0 *does* now scales with
# the image (the cross is sampled further out on a large one), because a filter
# with a fixed 3x3 footprint quietly loses its grip as the picture grows.
# RCAS's limiter rules out ringing, so the top of the range is usable — unlike
# the CAS pass this replaced, where high values haloed. Applied once, to the
# finished image — each pass keeps an unsharpened copy for the next one to work
# from, so sharpening can't stack up over a long escalation chain.
#
# Defaults to off. This and `clarity` below are only where the sliders under the
# image *start*, and starting at zero means the first thing on screen is what the
# model and the upscaler actually produced. Both are re-tunable live, since that
# unsharpened copy makes re-filtering cost milliseconds and lose nothing.
sharpness      = 0.0
# Local contrast, -1.0 to 1.0, 0.0 = off. A wide unsharp mask on brightness only:
# it moves the mid frequencies that read as contrast and depth and leaves the fine
# band alone, which is the opposite end of the spectrum from sharpness above.
# Reach for it when an image looks flat. Negative runs it backwards — the band is
# subtracted rather than added, flattening mid-scale structure into something
# softer and dreamier, the same trick as negative Clarity in a photo editor.
# Worth knowing why it exists: a low-strength img2img
# enters the schedule at low sigma and so only ever rebuilds fine texture — depth
# is the one thing the refine pass structurally cannot give you, and raising
# strength to reach it re-composes the picture instead. This is deterministic and
# invents nothing, so it has neither problem.
clarity        = 0.0
# "Refine image": a low-denoise img2img pass over the current image, at whatever
# size it currently is and with no rescale (0 steps = disabled). That makes it
# the finishing rung — it can follow a hi-res pass, and it can repeat. At output
# resolution this is a hires-fix-style pass, so strengths in the 0.20..0.35 range
# are conventional; it used to run at base resolution, where a much lighter touch
# was right because the upscale afterwards smeared most of it away anyway.
# Steps are a *floor* on effective denoising steps, not an exact count: strength
# decides how far up the noise schedule the pass starts, and starting higher
# needs proportionally more steps to resolve, so the count is raised to at least
# `steps * strength`. Too few steps for the strength leaves un-removed noise
# behind, which reads as grit. rustimage also scales the schedule it hands sd.cpp
# by 1/strength, since sd.cpp trims img2img schedules rather than scaling them.
# Strength must be 0.05..0.95 — at exactly 1.0 sd.cpp skips the trim and discards
# the init image, which makes the pass a plain txt2img.
refine_steps    = 2
refine_strength = 0.05
# "Hi-res pass": a second img2img at the OUTPUT resolution, which is what adds
# detail the FSR upscale can't invent. Optionally enlarges first (the UI picks a
# factor up to 4×). 0 steps = disabled, and no button appears. Effective steps,
# same as refine_steps above — this is the pass that decides how sharp the
# result looks, so raise it before reaching for sharpness.
hires_steps     = 8
hires_strength  = 0.30
# The Image-to-image tab's one pass: a source image you supply, put through this
# checkpoint once, after which the Refine and Hi-res buttons work on the result
# exactly as they do on a generation.
#
# Much higher than either escalation above, and that is the point rather than an
# oversight. Those two finish a picture this program already made; this one is
# asked to make a picture *out of* one it didn't. At 0.30 a source comes back
# essentially unchanged and the tab looks broken; 0.55 keeps the composition, the
# pose and the palette and re-draws the surface in the model's own idiom. Go
# lower for a retouch, higher (0.7+) to treat the source as a rough sketch.
#
# Steps are a floor here too, and strength raises it — at 0.55 the effective
# count is what `steps * 0.55` gives if that is more than this. CFG comes from
# img2img_cfg_scale above, like the other two img2img passes.
source_steps    = 12
source_strength = 0.55
# Longest side the HI-RES pass may diffuse at. Anything beyond it is reached with
# a final FSR upscale instead — past ~2048 SDXL's quality drops and the cost
# climbs quadratically. Measured on a 7900 XTX at 8 steps: 1536² ≈ 12 s,
# 2048² ≈ 20 s (both ~10 GB VRAM, with flash attention below).
# Refine is NOT under this ceiling: it doesn't rescale, so it has nowhere to fall
# back to, and an image FSR has stretched past its last diffusion is exactly the
# one worth refining. It will happily run at 3072² if you ask it to — watch VRAM.
hires_max_side  = 2048
# Flash attention for the img2img passes, whenever they run large enough to need
# the memory flags. Worth 6× at 2048² (122 s -> 20 s); turn it off only if your
# GPU/driver can't do it.
hires_flash_attn = true
# weight_type  = "q8_0"       # optional on-the-fly quantization
# extra_args   = ["--diffusion-fa"]

# ---------------------------------------------------------------------------
# [templates.<name>] — OPTIONAL tuned presets that override the defaults for one
# specific checkpoint (matched by `model` path). Use these for models that need
# non-default settings, e.g. a Turbo checkpoint:
# ---------------------------------------------------------------------------
# [templates.sdxl-turbo]
# description    = "SDXL-Turbo — fast draft (512 → 1024)"
# model          = "models/sdxl-turbo.safetensors"
# width          = 512
# height         = 512
# steps          = 4
# cfg_scale      = 1.0          # Turbo models want CFG 1
# img2img_cfg_scale = 2.5       # optional; omit to follow cfg_scale
# sampler        = "euler"
# upscale_factor = 2.0
# sharpness      = 0.35         # a template may start the slider somewhere else
# clarity        = -0.2         # negative softens; positive adds depth
# refine_steps    = 2
# refine_strength = 0.30
# hires_steps     = 6           # Turbo models need fewer steps here too
# hires_strength  = 0.30
# source_steps    = 8           # the Image-to-image tab's pass
# source_strength = 0.55

# ---------------------------------------------------------------------------
# [[video]] — video models.
#
# You usually don't need this table either. Drop the files into
# models/video/ and they are identified by what's inside them: both
# safetensors and GGUF carry a tensor index in a header at the front, and the
# tensor names in it name the architecture outright. That is how the roles get
# sorted out — transformer, VAE, text encoder, which of the two Wan VAEs, which
# expert of a pair — without anyone trusting a filename. `doctor` prints what it
# found and what it could not place.
#
# Suggested layout, which is also ComfyUI's and the one every download
# instruction assumes. The scan is recursive, so this is for your benefit, not
# the program's — a flat folder discovers exactly the same models:
#
#   models/video/diffusion_models/   the transformers
#   models/video/vae/                wan_2.1_vae / wan2.2_vae
#   models/video/text_encoders/      umt5-xxl (shared by every Wan)
#   models/video/loras/              e.g. the lightx2v 4-step pair
#   models/video/clip_vision/        Wan 2.1 I2V/FLF2V only
#
# What a [[video]] entry is still for:
#
#   * naming files you haven't downloaded yet, so the UI and `doctor` list the
#     model greyed out with the exact filename it is waiting for — the two
#     entries below do precisely that, and are the download checklist;
#   * pinning settings once you have measured them on this card;
#   * the one thing no header can answer: which half of a mixture-of-experts
#     pair a file is. The two experts have identical tensor names and identical
#     shapes. If the filename says `LowNoise`/`HighNoise` the scan pairs them;
#     if it says nothing, the file is listed as a `wan_dense` model that runs on
#     its own, and pairing it is a decision you make here.
#
# An entry REPLACES a discovered model rather than patching it, matching by
# `name` or by naming the same `diffusion_model` file. So an entry is complete
# in itself; anything it leaves out comes from the family recipe, not from the
# discovered copy.
#
# `family` is the required field and the one that matters: it decides which
# flags get emitted (the A14B pair needs a whole second `--high-noise-*` set),
# which grid width/height and frame count round to, and whether fps is yours to
# choose. One of:
#
#   wan22_ti2v_5b   one dense checkpoint; the only Wan wanting `wan2.2_vae`.
#                   Size grid 32, native 24 fps.
#   wan22_a14b      the mixture-of-experts pair. Size grid 16, native 16 fps.
#                   Needs high_noise_diffusion_model.
#   wan_dense       any single dense Wan on the 2.1 VAE — a 2.1 T2V, or one
#                   expert of an A14B run alone. Size grid 16.
#   wan21_vace      frames in, frames out — the pass that refines a finished
#                   clip. Size grid 16.
#   minimax_h3      present so it's a config edit later, not runnable here: a
#                   19.9 GB DiT plus a 14.6 GB Qwen3-VL-32B encoder at Q4_K_M
#                   fits neither 24 GB of VRAM nor 30 GB of RAM.
#
# Frame counts round to the family's grid, and the two grids round in opposite
# directions — Wan *down* to 4k+1 (34 frames runs as 33), H3 *up* to 17k+5. The
# UI shows the rounded number and the duration it implies.
#
# Sizes/steps/cfg below are the values every example in stable-diffusion.cpp's
# own `docs/wan.md` uses. They are a starting point, not a measurement on this
# card — replace them once you have timings.
# ---------------------------------------------------------------------------

[[video]]
name        = "wan2.2-ti2v-5b"
description = "Wan 2.2 TI2V 5B — one file, the quick way to prove a clip runs"
family      = "wan22_ti2v_5b"
diffusion_model = "models/video/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors"
vae             = "models/video/vae/wan2.2_vae.safetensors"   # NOT wan_2.1_vae
# Every Wan family shares this one encoder, so it downloads once. This is the
# fp8 file that was already in models/video/: sd.cpp reads F8_E4M3 safetensors
# directly, and its name table maps ComfyUI's `.scale_weight` suffix onto the
# `.weight_scale` it expects, so the scaled variant loads unconverted. Vulkan
# has no fp8 matmul, so each tensor is cast to BF16 as the graph is built —
# correct, but if it turns out slow or tight, the drop-in swap is
# `umt5-xxl-encoder-Q8_0.gguf` from city96/umt5-xxl-encoder-gguf.
t5xxl           = "models/video/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
width      = 832
height     = 480
frames     = 33        # already on the 4k+1 grid: 1.4 s at 24 fps
fps        = 24        # what this one is trained at
steps      = 20
cfg_scale  = 6.0
flow_shift = 3.0       # every documented Wan run passes 3.0 rather than "auto"

[[video]]
name        = "wan2.2-i2v-a14b"
description = "Wan 2.2 I2V A14B — the MoE pair; one expert resident per step"
family      = "wan22_a14b"
# Only one expert is active at a time, so one expert's worth of weights is what
# the card holds — the 24 GB is not the limit. `offload_to_cpu` keeps *both* in
# system RAM, and that is the wall: 14B at Q4_K_M is roughly 8 GB, so the pair
# plus the ~7 GB encoder is around 23 GB against 30 GB total. It fits, but not
# by much, and the estimate is arithmetic rather than a measurement — peak RSS
# during a run is the number that settles it. Q8_0 (~15 GB an expert) does not
# fit at all. If 23 GB turns out to crowd the machine, Q3_K_M on the experts
# and the Q8_0 GGUF encoder are the two levers, in that order.
diffusion_model            = "models/video/diffusion_models/Wan2.2-I2V-A14B-LowNoise-Q4_K_M.gguf"
high_noise_diffusion_model = "models/video/diffusion_models/Wan2.2-I2V-A14B-HighNoise-Q4_K_M.gguf"
vae                        = "models/video/vae/wan_2.1_vae.safetensors"
t5xxl                      = "models/video/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
width      = 832
height     = 480
frames     = 33        # 2.1 s at 16 fps
fps        = 16
steps      = 10        # the low-noise expert's half of the schedule
cfg_scale  = 3.5
high_noise_steps     = 8
high_noise_cfg_scale = 3.5
flow_shift = 3.0
# Where the schedule hands over from the high-noise expert to the low-noise one.
# sd.cpp only honours it when high_noise_steps is unset (its own flag help says
# "only enabled if --high-noise-steps is set to -1"), so with the 8 above it
# would do nothing.
# moe_boundary = 0.875
#
# The 4-step lightx2v LoRA pair, which takes 8+10 steps to 4+4. Named without
# angle brackets; `|high_noise|` targets the high-noise expert. Uncomment
# together with steps = 4 / high_noise_steps = 4 once you've measured whether
# the quality trade is worth it on this card.
# loras = [
#   "wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise:1",
#   "|high_noise|wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise:1",
# ]
# lora_dir = "models/loras"
#
# If a clip dies in the VAE decode rather than the sampler — the likelier of the
# two on a Wan model — turn this on first. It costs time, not quality.
# vae_tiling = true
#
# Further OOM escalations, in the order worth trying:
# extra_args = ["--auto-fit", "off"]
